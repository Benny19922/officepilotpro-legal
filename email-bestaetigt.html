<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>E-Mail bestätigt – OfficePilotPro</title>
<style>
  :root { --ink:#2A2622; --muted:#6b6460; --accent:#2F5C8C; --green:#2E7D5B; --bg:#f7f5f5; }
  * { box-sizing:border-box; }
  html,body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
         display:flex; align-items:center; justify-content:center; padding:24px; }
  .card { max-width:460px; width:100%; background:#fff; border:1px solid #e4dddf;
          border-radius:18px; padding:40px 32px; text-align:center;
          box-shadow:0 8px 30px rgba(0,0,0,.05); }
  .badge { width:72px; height:72px; border-radius:50%; margin:0 auto 20px;
           background:rgba(46,125,91,.12); display:flex; align-items:center; justify-content:center; }
  .badge svg { width:38px; height:38px; }
  h1 { font-size:1.5rem; margin:0 0 10px; color:var(--green); }
  p { font-size:1rem; line-height:1.55; color:var(--ink); margin:0 0 8px; }
  .muted { color:var(--muted); font-size:.92rem; margin-top:16px; }
  .brand { margin-top:26px; color:var(--muted); font-size:.8rem; letter-spacing:.3px; }
</style>
</head>
<body>
  <div class="card">
    <div class="badge">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M20 6L9 17l-5-5" stroke="#2E7D5B" stroke-width="2.5"
              stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <h1>E-Mail bestätigt</h1>
    <p>Deine E-Mail-Adresse wurde erfolgreich bestätigt.</p>
    <p>Du kannst jetzt zur <strong>OfficePilotPro</strong>-App zurückkehren und dich anmelden.</p>
    <p class="muted">Diese Seite kannst du einfach schließen.</p>
    <div class="brand">OfficePilotPro</div>
  </div>
</body>
</html>
