<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Passwort zurücksetzen – OfficePilotPro</title>
<style>
  :root { --ink:#2A2622; --muted:#6b6460; --accent:#2F5C8C; --green:#2E7D5B; --red:#c0392b; --line:#e4dddf; --bg:#f7f5f5; }
  * { box-sizing:border-box; }
  html,body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
         display:flex; align-items:center; justify-content:center; padding:24px; }
  .card { max-width:420px; width:100%; background:#fff; border:1px solid var(--line);
          border-radius:18px; padding:32px 28px; box-shadow:0 8px 30px rgba(0,0,0,.05); }
  h1 { font-size:1.4rem; margin:0 0 6px; color:var(--accent); }
  p { font-size:.98rem; line-height:1.5; color:var(--muted); margin:0 0 18px; }
  label { display:block; font-size:.78rem; font-weight:700; letter-spacing:.5px;
          color:var(--muted); margin:14px 0 6px; text-transform:uppercase; }
  input { width:100%; padding:12px 14px; border:1px solid var(--line); border-radius:12px;
          font-size:1rem; }
  button { width:100%; margin-top:20px; padding:14px; border:0; border-radius:13px;
           background:var(--accent); color:#fff; font-size:1rem; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
  .msg { margin-top:16px; font-size:.92rem; line-height:1.45; }
  .msg.ok { color:var(--green); } .msg.err { color:var(--red); }
  .hidden { display:none; }
</style>
</head>
<body>
  <div class="card">
    <h1>Passwort zurücksetzen</h1>
    <p id="intro">Bitte vergib ein neues Passwort für dein OfficePilotPro-Konto.</p>

    <div id="form">
      <label for="pw1">Neues Passwort</label>
      <input id="pw1" type="password" autocomplete="new-password" placeholder="Mindestens 6 Zeichen">
      <label for="pw2">Passwort wiederholen</label>
      <input id="pw2" type="password" autocomplete="new-password">
      <button id="save" disabled>Passwort speichern</button>
    </div>

    <div id="msg" class="msg"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://smxskaqoijdagppikdsp.supabase.co';
    const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNteHNrYXFvaWpkYWdwcGlrZHNwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEyMTk2MTMsImV4cCI6MjA5Njc5NTYxM30._iIchkPdEHuuXwW4DImpR9risFRqsiNRgaH6M5Q9DcY';

    const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON, {
      auth: { detectSessionInUrl: true, flowType: 'implicit' }
    });

    const $ = (id) => document.getElementById(id);
    const msg = $('msg'), save = $('save'), form = $('form'), intro = $('intro');
    let hasSession = false;

    function show(text, ok) { msg.textContent = text; msg.className = 'msg ' + (ok ? 'ok' : 'err'); }

    function enableForm() {
      if (hasSession) return;
      hasSession = true;
      save.disabled = false;
    }

    // Recovery-Session aus dem URL-Fragment übernehmen.
    client.auth.onAuthStateChange((event, session) => {
      if (event === 'PASSWORD_RECOVERY' || session) enableForm();
    });
    setTimeout(async () => {
      const { data } = await client.auth.getSession();
      if (data.session) enableForm();
      else if (!hasSession) {
        form.classList.add('hidden');
        intro.textContent = 'Der Link ist ungültig oder abgelaufen. Bitte fordere in der App einen neuen an.';
      }
    }, 1500);

    save.addEventListener('click', async () => {
      const pw1 = $('pw1').value, pw2 = $('pw2').value;
      if (pw1.length < 6) { show('Das Passwort muss mindestens 6 Zeichen haben.', false); return; }
      if (pw1 !== pw2) { show('Die Passwörter stimmen nicht überein.', false); return; }
      save.disabled = true; show('Speichern …', true);
      const { error } = await client.auth.updateUser({ password: pw1 });
      if (error) { show('Fehler: ' + error.message, false); save.disabled = false; }
      else {
        form.classList.add('hidden');
        intro.classList.add('hidden');
        show('✓ Passwort geändert. Du kannst dich jetzt in der OfficePilotPro-App mit dem neuen Passwort anmelden.', true);
      }
    });
  </script>
</body>
</html>
