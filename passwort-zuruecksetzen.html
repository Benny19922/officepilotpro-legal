<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<!-- Inhaltsrichtlinie: nur eigene Skripte, Verbindung nur zu Supabase und zum Leak-Prüfdienst
     (Have I Been Pwned, erhält nur 5 Zeichen eines Prüfwerts). Kein Fremdskript kann hier ein
     getipptes Passwort mitlesen. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; connect-src https://smxskaqoijdagppikdsp.supabase.co https://api.pwnedpasswords.com; style-src 'unsafe-inline'; img-src 'self' data:; base-uri 'none'; form-action 'none'">
<title>Passwort zurücksetzen – OfficePilotPro</title>
<style>
  :root { --ink:#2A2622; --muted:#6b6460; --accent:#2F5C8C; --green:#2E7D5B; --red:#c0392b; --line:#e4dddf; --bg:#f7f5f5; }
  * { box-sizing:border-box; }
  html,body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
         display:flex; align-items:center; justify-content:center; padding:24px; }
  .card { max-width:420px; width:100%; background:#fff; border:1px solid var(--line);
          border-radius:18px; padding:32px 28px; box-shadow:0 8px 30px rgba(0,0,0,.05); }
  h1 { font-size:1.4rem; margin:0 0 6px; color:var(--accent); }
  p { font-size:.98rem; line-height:1.5; color:var(--muted); margin:0 0 18px; }
  label { display:block; font-size:.78rem; font-weight:700; letter-spacing:.5px;
          color:var(--muted); margin:14px 0 6px; text-transform:uppercase; }
  input { width:100%; padding:12px 14px; border:1px solid var(--line); border-radius:12px;
          font-size:1rem; }
  button { width:100%; margin-top:20px; padding:14px; border:0; border-radius:13px;
           background:var(--accent); color:#fff; font-size:1rem; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
  .msg { margin-top:16px; font-size:.92rem; line-height:1.45; }
  .msg.ok { color:var(--green); } .msg.err { color:var(--red); }
  .hidden { display:none; }
</style>
</head>
<body>
  <div class="card">
    <h1>Passwort zurücksetzen</h1>
    <p id="intro">Bitte vergib ein neues Passwort für dein OfficePilotPro-Konto.</p>

    <div id="form">
      <label for="pw1">Neues Passwort</label>
      <input id="pw1" type="password" autocomplete="new-password" placeholder="Mindestens 10 Zeichen, Buchstaben und Ziffern">
      <label for="pw2">Passwort wiederholen</label>
      <input id="pw2" type="password" autocomplete="new-password">
      <button id="save" disabled>Passwort speichern</button>
    </div>

    <div id="msg" class="msg"></div>
  </div>

  <!-- Supabase-Bibliothek liegt lokal in fester Version — kein CDN, kein „irgendeine Version 2".
       SHA-256 dff1e545… am 25.09.2026 gegen jsDelivr und unpkg gleich geprüft. Neue Version:
       Datei in vendor/ tauschen und hier den Namen anpassen. -->
  <script src="vendor/supabase-js-2.117.1.min.js"></script>
  <script src="passwort-zuruecksetzen.js"></script>
</body>
</html>
